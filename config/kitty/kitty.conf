# Font
font_family      family="Cascadia Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto

# Font size (in pts)
font_size 14.0

# OS specific tweaks
macos_titlebar_color system
macos_option_as_alt yes

# Send a linefeed on Shift+Enter so TUIs that bind newline to ctrl+j (opencode)
# get a newline; passes through SSH + tmux unchanged, unlike the kitty protocol
map shift+enter send_text all \x0a
macos_show_window_title_in all

confirm_os_window_close 0

# Theme
#include dracula.conf
#include nord.conf
#include gruvbox-dark.conf
include Catppuccin-Latte.conf
#include tokyonight_day.conf

