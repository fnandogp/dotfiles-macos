# kitty.conf - only overrides defaults; see https://sw.kovidgoyal.net/kitty/conf/ for the rest.
# Comments must start at column 0 (kitty has no inline comments).
# Reload after edits: cmd+ctrl+, (or restart). New include files need `rcup` first.

# Font
font_family      family="JetBrainsMonoNL NFM"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        15.0

# Disable macOS font thickening (default 1.7 30) so text isn't bolder than expected
text_composition_strategy 1.0 0

# Inner spacing between text and window edge (pt)
window_padding_width 8

# macOS: treat alt as Esc+ for shell word-motions
macos_option_as_alt yes

# Send a linefeed on Shift+Enter so TUIs that bind newline to ctrl+j (opencode)
# get a newline; passes through SSH + tmux unchanged, unlike the kitty protocol
map shift+enter send_text all \x0a

# Show window title in both titlebar and tab bar
macos_show_window_title_in all

# No prompt on window close
confirm_os_window_close 0

# Theme - one active include; others kept as quick swaps
#include themes/dracula.conf
#include themes/nord.conf
#include themes/gruvbox-dark.conf
#include themes/Catppuccin-Latte.conf
#include themes/tokyonight_day.conf
#include themes/rose-pine-dawn.conf
include themes/Catppuccin-Mocha.conf
