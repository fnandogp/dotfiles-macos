"$schema" = 'https://starship.rs/config-schema.json'

format = """
$directory\
$git_branch\
$git_state\
$git_status\
$nodejs\
$cmd_duration\
$line_break\
$python\
$character"""

command_timeout=5000

[directory]
style = "blue"
truncation_length = 0
truncate_to_repo = false
read_only = " ro"

[directory.substitutions]
"~/workspace/" = ""

[character]
success_symbol = "[❯](purple)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"

[git_branch]
format = "[$branch]($style)"
symbol = "git "
style = "bright-black"

[git_status]
format = "[(*$conflicted$untracked$modified$staged$renamed$deleted)](218)( [$ahead_behind$stashed]($style)) "
stashed = "≡"
style = "cyan"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

[cmd_duration]
format = "[$duration]($style) "
style = "yellow"

[python]
format = "[$virtualenv]($style) "
symbol = "python "
style = "bright-black"

[nodejs]
format = '[$symbol$version]($style) '
style = "bright-black"
symbol = "node "

