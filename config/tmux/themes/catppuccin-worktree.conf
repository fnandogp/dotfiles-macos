# vim:set ft=tmux:
# Catppuccin status module wrapping the shared worktree module.
# Must live in its own file: it is parsed when sourced (after the catppuccin
# plugin has finished loading), so its %hidden MODULE_NAME isn't clobbered by
# the plugin's own module files, which each set MODULE_NAME during load.
#
# Catppuccin module protocol: define @catppuccin_<name>_icon/_color/_text,
# then source the plugin's status_module.conf, which assembles them into
# @catppuccin_status_<name> for use in status-left/right.
%hidden MODULE_NAME="worktree"
set -ogq "@catppuccin_${MODULE_NAME}_icon" " "
set -ogqF "@catppuccin_${MODULE_NAME}_color" "#{E:@thm_rosewater}"
set -ogq "@catppuccin_${MODULE_NAME}_text" " #{E:@worktree_text}"
# Plain source: with -F the path gets format-expanded but ~ is not expanded
source "~/.config/tmux/plugins/tmux/utils/status_module.conf"
