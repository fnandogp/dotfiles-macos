# vim:set ft=tmux:
# Dracula via the official dracula/tmux plugin (its defaults are the official
# dark palette). Cloned manually because tpm can't hold catppuccin/tmux and
# dracula/tmux side by side (both repos are named "tmux"):
#   git clone https://github.com/dracula/tmux ~/.config/tmux/plugins/dracula

set -g @dracula-show-powerline true
set -g @dracula-show-left-icon session
set -g @dracula-show-left-sep ""
set -g @dracula-show-right-sep ""
# Single space = no status widgets (an empty string falls back to the defaults)
set -g @dracula-plugins " "

# Colours for the custom worktree pill. The plugin's palette variables live in
# shell scope (not readable from tmux formats), so the two needed are mirrored
# here as theme options
set -g @theme_worktree "#ff79c6" # dracula pink
set -g @theme_bg "#282a36"       # dracula background

# Alucard light palette (official colours from dracula/vim colors/alucard.vim);
# uncomment to go light. Role swap: dark_gray carries the cream bg (text on
# coloured widgets), white the near-black fg, dark_purple the selection surface
# set -g @dracula-colors "
# white='#1F1F1F'
# gray='#DEDCCF'
# dark_gray='#FFFBEB'
# light_purple='#644AC9'
# dark_purple='#CFCFDE'
# purple='#644AC9'
# cyan='#036A96'
# green='#14710A'
# orange='#A34D14'
# red='#CB3A2A'
# pink='#A3144D'
# yellow='#846E15'
# "
# set -g @theme_worktree "#A3144D" # alucard pink
# set -g @theme_bg "#FFFBEB"       # alucard background

run '~/.config/tmux/plugins/dracula/dracula.tmux'

# Worktree pill on the right, built from the shared module in worktree.conf.
# Appended after the run line because the plugin rebuilds status-right when it
# loads; @theme_* refs expand at display time, so palette swaps apply live
set -g status-right-length 100
set -ag status-right "#[fg=#{@theme_worktree},bg=default]#[fg=#{@theme_bg},bg=#{@theme_worktree}] #{E:@worktree_icon}#{E:@worktree_text} #[fg=#{@theme_worktree},bg=default]"
