# vim:set ft=tmux:
# Dracula palette. The layout lives in styles.conf, driven entirely by
# these @theme_* options; this file only picks the colours.

# --- Palette: dracula dark (official colours from dracula/dracula-theme) ---
set -g @theme_bg "#282a36"       # status bar background
set -g @theme_fg "#f8f8f2"       # default text (foreground)
set -g @theme_surface "#44475a"  # current window pill (current line)
set -g @theme_muted "#6272a4"    # inactive windows, separators (comment)
set -g @theme_session "#50fa7b"  # session name (green)
set -g @theme_worktree "#ff79c6" # worktree pill (pink)
set -g @theme_prefix "#f1fa8c"   # session name while prefix is pressed (yellow)
set -g @theme_attention "#f1fa8c" # window waiting on agent input (yellow)

# --- Palette: alucard light (official colours from dracula/vim alucard.vim);
# uncomment this block, comment the dark one ---
# set -g @theme_bg "#FFFBEB"       # status bar background
# set -g @theme_fg "#1F1F1F"       # default text (foreground)
# set -g @theme_surface "#CFCFDE"  # current window pill (selection)
# set -g @theme_muted "#6C664B"    # inactive windows, separators (comment)
# set -g @theme_session "#14710A"  # session name (green)
# set -g @theme_worktree "#A3144D" # worktree pill (pink)
# set -g @theme_prefix "#846E15"   # session name while prefix is pressed (yellow)
# set -g @theme_attention "#846E15" # window waiting on agent input (yellow)

# --- Shared layout (must come after the palette: -F styles freeze on source) ---
source "~/.config/tmux/styles.conf"
