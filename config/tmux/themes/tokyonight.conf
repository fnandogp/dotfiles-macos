# vim:set ft=tmux:
# Tokyo Night palette. The layout lives in styles.conf, driven entirely by
# these @theme_* options; this file only picks the colours.

# --- Palette: tokyonight night (official colours from folke/tokyonight.nvim) ---
set -g @theme_bg "#16161e"       # status bar background (bg_dark)
set -g @theme_fg "#c0caf5"       # default text (fg)
set -g @theme_surface "#292e42"  # current window pill (bg_highlight)
set -g @theme_muted "#565f89"    # inactive windows, separators (comment)
set -g @theme_session "#7aa2f7"  # session name (blue)
set -g @theme_worktree "#bb9af7" # worktree pill (magenta)
set -g @theme_prefix "#e0af68"   # session name while prefix is pressed (yellow)

# --- Shared layout (must come after the palette: -F styles freeze on source) ---
source "~/.config/tmux/styles.conf"
