# vim:set ft=tmux:
# Rosé Pine Dawn palette. The layout lives in styles.conf, driven entirely by
# these @theme_* options; this file only picks the colours.

# --- Palette: rosé pine dawn (official colours from rosepinetheme.com) ---
set -g @theme_bg "#faf4ed"       # status bar background (base, blends with terminal)
set -g @theme_fg "#575279"       # default text (text)
set -g @theme_surface "#dfdad9"  # current window pill (highlight med)
set -g @theme_muted "#9893a5"    # inactive windows, separators (muted)
set -g @theme_session "#286983"  # session name (pine)
set -g @theme_worktree "#907aa9" # worktree pill (iris)
set -g @theme_prefix "#ea9d34"   # session name while prefix is pressed (gold)
set -g @theme_attention "#ea9d34" # window waiting on agent input (gold)

# --- Shared layout (must come after the palette: -F styles freeze on source) ---
source "~/.config/tmux/styles.conf"
