# vim:set ft=tmux:
# Catppuccin palette. The layout lives in styles.conf, driven entirely by
# these @theme_* options; this file only picks the colours.

# --- Palette: catppuccin latte (official colours from catppuccin/palette) ---
set -g @theme_bg "#e6e9ef"       # status bar background (mantle)
set -g @theme_fg "#4c4f69"       # default text (text)
set -g @theme_surface "#ccd0da"  # current window pill (surface0)
set -g @theme_muted "#9ca0b0"    # inactive windows, separators (overlay0)
set -g @theme_session "#40a02b"  # session name (green)
set -g @theme_worktree "#dc8a78" # worktree pill (rosewater)
set -g @theme_prefix "#d20f39"   # session name while prefix is pressed (red)

# --- Palette: catppuccin mocha (uncomment this block, comment the latte one) ---
# set -g @theme_bg "#181825"       # status bar background (mantle)
# set -g @theme_fg "#cdd6f4"       # default text (text)
# set -g @theme_surface "#313244"  # current window pill (surface0)
# set -g @theme_muted "#6c7086"    # inactive windows, separators (overlay0)
# set -g @theme_session "#a6e3a1"  # session name (green)
# set -g @theme_worktree "#f5e0dc" # worktree pill (rosewater)
# set -g @theme_prefix "#f38ba8"   # session name while prefix is pressed (red)

# --- Shared layout (must come after the palette: -F styles freeze on source) ---
source "~/.config/tmux/styles.conf"
