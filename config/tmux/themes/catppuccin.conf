# vim:set ft=tmux:
# Catppuccin latte (matches the Linux dotfiles theme)

set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavor "latte"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

# Rounded status modules on both sides
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_connect_separator "no"

# Load catppuccin before referencing its status modules
run '~/.config/tmux/plugins/tmux/catppuccin.tmux'

# Worktree status module, catppuccin-styled (separate file - see its header)
source "~/.config/tmux/themes/catppuccin-worktree.conf"

# Layout: session module, a vertically-centred dot, then the windows; worktree
# module on the right. #{E:...} expands the module options at display time
set -g status-right-length 100
set -g status-left-length 100
set -g status-left "#{E:@catppuccin_status_session}"
set -ag status-left "#[fg=#{E:@thm_overlay_0}] • "
set -g status-right "#{E:@catppuccin_status_worktree}"
