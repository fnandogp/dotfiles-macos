# vim:set ft=tmux:
# Gruvbox: hand-rolled status bar - no theme plugin. Owns palette and layout;
# positioning and cross-theme style resets live in theme.conf.
#
# How it works: the @theme_* user options below are the single source of
# colour truth - every style and format references them, so swapping the
# palette re-themes the whole bar.
#
# `set -gF` freezes pure-colour styles at source time; the status/window
# formats use plain `set -g` so #S/#I/#W, the prefix conditional and the
# worktree script stay live (their #{@theme_*} refs expand at display time).
# The rounded pill caps are nerd font glyphs (U+E0B6 left, U+E0B4 right).

# --- Palette: gruvbox dark ---
set -g @theme_bg "#32302F"       # status bar background
set -g @theme_fg "#EBDBB2"       # default text
set -g @theme_surface "#504945"  # current window pill
set -g @theme_muted "#928374"    # inactive windows, separators
set -g @theme_session "#98971A"  # session name
set -g @theme_worktree "#D3869B" # worktree pill
set -g @theme_prefix "#D79921"   # session name while prefix is pressed

# --- Palette: gruvbox light (uncomment this block, comment the dark one) ---
# set -g @theme_bg "#EBDBB2"       # status bar background
# set -g @theme_fg "#3C3836"       # default text
# set -g @theme_surface "#D5C4A1"  # current window pill
# set -g @theme_muted "#7C6F64"    # inactive windows, separators
# set -g @theme_session "#79740E"  # session name
# set -g @theme_worktree "#B16286" # worktree pill
# set -g @theme_prefix "#B57614"   # session name while prefix is pressed

set -g status-left-length 100
set -g status-right-length 100

# --- Bar ---
set -gF status-style "bg=#{@theme_bg},fg=#{@theme_fg}"

# --- Left: session name, then a vertically-centred dot before the windows ---
set -g status-left "#[bold]#{?client_prefix,#[fg=#{@theme_prefix}],#[fg=#{@theme_session}]}#S#[fg=#{@theme_muted},nobold] • "

# --- Windows: current window as a rounded pill, others muted ---
set -g window-status-separator ""
set -g window-status-format "#[fg=#{@theme_muted}] #I #W "
set -g window-status-current-format "#[fg=#{@theme_surface},bg=default]#[fg=#{@theme_fg},bg=#{@theme_surface},bold]#I #W#[fg=#{@theme_surface},bg=default]"
set -g window-status-activity-style "bold"
set -g window-status-bell-style "bold"

# --- Right: worktree pill. @worktree_icon/@worktree_text come from the shared
# module in worktree.conf, sourced by theme.conf before this file ---
set -g status-right "#[fg=#{@theme_worktree},bg=default]#[fg=#{@theme_bg},bg=#{@theme_worktree}] #{E:@worktree_icon}#{E:@worktree_text} #[fg=#{@theme_worktree},bg=default]"

# --- Panes and messages ---
set -gF pane-border-style "fg=#{@theme_surface}"
set -gF pane-active-border-style "fg=#{@theme_session}"
set -gF message-style "bg=#{@theme_surface},fg=#{@theme_fg}"
set -gF message-command-style "bg=#{@theme_surface},fg=#{@theme_fg}"
set -gF mode-style "bg=#{@theme_surface},fg=#{@theme_fg}"
set -gF copy-mode-match-style "bg=#{@theme_prefix},fg=#{@theme_bg}"
set -gF copy-mode-current-match-style "bg=#{@theme_worktree},fg=#{@theme_bg}"

# --- Popups (tmux-fzf and friends) and menus (tmux-menus) ---
set -gF popup-style "bg=default,fg=#{@theme_fg}"
set -gF popup-border-style "fg=#{@theme_surface}"
set -gF menu-style "bg=default,fg=#{@theme_fg}"
set -gF menu-selected-style "bg=#{@theme_surface},fg=#{@theme_fg},bold"
set -gF menu-border-style "fg=#{@theme_surface}"

# --- Misc colours ---
set -gF clock-mode-colour "#{@theme_session}"
set -gF display-panes-colour "#{@theme_muted}"
set -gF display-panes-active-colour "#{@theme_session}"
