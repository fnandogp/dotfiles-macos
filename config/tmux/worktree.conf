# vim:set ft=tmux:
# Catppuccin status module showing the pane directory. dir_status.sh prints the
# bare directory name, or "<project> (<worktree>)" for a linked git worktree.
%hidden MODULE_NAME="worktree"

set -ogq "@catppuccin_${MODULE_NAME}_icon" " "
set -ogqF "@catppuccin_${MODULE_NAME}_color" "#{E:@thm_rosewater}"
set -ogq "@catppuccin_${MODULE_NAME}_text" " #(~/.config/tmux/scripts/dir_status.sh '#{pane_current_path}')"

source -F "#{d:current_file}/plugins/tmux/utils/status_module.conf"
