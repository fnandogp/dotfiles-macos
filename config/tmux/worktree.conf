# vim:set ft=tmux:
# Theme-agnostic worktree status module. dir_status.sh prints the bare
# directory name, or "<project> (<worktree>)" for a linked git worktree.
# Themes embed it via #{E:@worktree_icon} and #{E:@worktree_text}.
set -g @worktree_icon " "
set -g @worktree_text "#(~/.config/tmux/scripts/dir_status.sh '#{pane_current_path}')"
