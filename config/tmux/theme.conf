# vim:set ft=tmux:
# Styling orchestrator: everything styling related enters through this file.
# tmux.conf sources only this; pick the active theme below - one file per
# theme lives in themes/.

# --- Positioning (shared by all themes) ---
set -g status-position top
set -g status-justify left

# --- Reset styling to tmux defaults before the active theme applies its own,
# so swapping themes on a live server never inherits stale colours (theme
# plugins set options like popup-style that other themes don't touch).
# `set -gu` unsets the global value; the option falls back to tmux's default ---
set -gu status-style
set -gu status-left
set -gu status-right
set -gu window-status-style
set -gu window-status-current-style
set -gu window-status-format
set -gu window-status-current-format
set -gu window-status-separator
set -gu message-style
set -gu message-command-style
set -gu mode-style
set -gu copy-mode-match-style
set -gu copy-mode-current-match-style
set -gu pane-border-style
set -gu pane-active-border-style
# catppuccin sets pane borders as window options, which outrank the global ones
set -wgu pane-border-style
set -wgu pane-active-border-style
set -gu popup-style
set -gu popup-border-style
set -gu menu-style
set -gu menu-selected-style
set -gu menu-border-style
set -gu clock-mode-colour
set -gu display-panes-colour
set -gu display-panes-active-colour

# --- Shared status modules ---
source "~/.config/tmux/worktree.conf"

# --- Active theme ---
source "~/.config/tmux/themes/tokyonight.conf"
# source "~/.config/tmux/themes/gruvbox.conf"
# source "~/.config/tmux/themes/dracula.conf"
# source "~/.config/tmux/themes/catppuccin.conf"
