# Tmux Configuration

# Set true color support and enable extended keys
set-option -sa terminal-overrides ",xterm*:Tc"
set-option -sa terminal-overrides ",*:extkeys"
set-option -sa terminal-overrides ",*:kf13=\E[1;2P"

# Enable extended key reporting for better key detection
# (server option, and csi-u format so inner apps like opencode get CSI-u sequences)
set -s extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features '*:extkeys'

# Forward xterm modifyOtherKeys / kitty keyboard protocol requests so apps
# inside tmux can receive Shift+Enter, Ctrl+Enter, etc.
set -as terminal-overrides '*:Smulx=\E[4::%p1%dm'

# Clipboard bridging over SSH (Kitty/Ghostty/WezTerm on the Mac client).
# `on` makes tmux push its selection to the client terminal via OSC 52 (so a
# mouse-copy in tmux lands on the macOS clipboard) AND passes through OSC 52
# from apps inside tmux. Paste the OTHER way (macOS -> tmux) is NOT OSC 52:
# use Kitty's own paste key (Cmd+V / Ctrl+Shift+V), which injects the macOS
# clipboard as keystrokes straight into the remote pane.
set -s set-clipboard on
set -as terminal-features 'xterm-kitty:clipboard'

# Enable mouse support
set -g mouse on
set -g default-terminal "tmux-256color"

# Start session, windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Quick session switching
bind C-b switch-client -l
bind C-1 switch-client -t 1
bind C-2 switch-client -t 2
bind C-3 switch-client -t 3
bind C-4 switch-client -t 4
bind C-5 switch-client -t 5

# Quick window switching
bind b last-window

# Reload config with prefix-r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# Zoom bindings
unbind z
unbind Z
bind z select-pane -t 1 \; resize-pane -Z  # Zoom first pane
bind Z resize-pane -Z                       # Zoom current pane (default)

# Quick session switching
unbind-key "s"
bind-key "s" run-shell -b "~/.config/tmux/plugins/tmux-fzf/scripts/session.sh switch"
# Quick window switching
unbind-key "w"
bind-key "w" run-shell -b "~/.config/tmux/plugins/tmux-fzf/scripts/window.sh switch"


# Split panes with | and - (more intuitive)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Resize panes with vim-like keys
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Move windows with vim-like keys (h/l = left/right)
bind -r h swap-window -d -t -1
bind -r l swap-window -d -t +1

# New window in current path
bind c new-window -c "#{pane_current_path}"

# Activity monitoring
setw -g monitor-activity off
set -g visual-activity off

# Increase scrollback buffer size
set -g history-limit 10000

# Don't exit from tmux when closing a session
set -g detach-on-destroy off

# Plugin manager setup
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'sainnhe/tmux-fzf'
# Hide the tmux-fzf preview window (still toggleable via fzf's toggle-preview)
set-environment -g TMUX_FZF_PREVIEW 0

# Plugin: tmux-menus
set -g @plugin 'jaclu/tmux-menus'

# Plugin: vim-tmux-navigator
set -g @plugin 'christoomey/vim-tmux-navigator'

# Styling: theme.conf orchestrates everything styling related (active theme,
# positioning); individual themes live in themes/
source "~/.config/tmux/theme.conf"

# Plugin: tmux-continuum
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Plugin: tmux-agent-indicator
set -g @plugin 'accessd/tmux-agent-indicator'
set -g @agent-indicator-border-enabled 'on'
set -g @agent-indicator-indicator-enabled 'off'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
